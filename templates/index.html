<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111319" id="themeColor">
<title>//Core · Blaine</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111319'/%3E%3Cpath d='M16 6v18M9 10h14M9 10l-3 7h6zM23 10l-3 7h6zM11 24h10' stroke='%23d9dce3' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --accent:#d9dce3;--accent-ink:#101114;--accent-text:#d9dce3;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --stage:#07080b;--stage-glow:rgba(120,140,200,.14);
  --win:#111319;--win2:#171a22;--win3:#1d212b;--line:#262a35;--line2:#323847;
  --text:#eceef4;--muted:#8b92a3;--shadow:0 24px 80px rgba(0,0,0,.65);
  --ok:#4cc35a;--bad:#ff7a85;--note:#ffbf47;
}
html[data-theme="light"]{
  color-scheme:light;
  --stage:#d9dde6;--stage-glow:rgba(70,90,150,.18);
  --win:#ffffff;--win2:#f3f4f8;--win3:#e9ecf2;--line:#dfe2ea;--line2:#cbd0dc;
  --text:#14161c;--muted:#5f6675;--shadow:0 24px 70px rgba(30,40,70,.22);
  --ok:#1f8a2e;--bad:#c0262f;--note:#9a5a00;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:14px/1.5 var(--font);color:var(--text);background:var(--stage);
  background-image:radial-gradient(900px 420px at 50% -120px,var(--stage-glow),transparent 70%);
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}

/* ---------- окно ---------- */
.window{width:min(520px,100vw);height:min(780px,100dvh);display:flex;flex-direction:column;overflow:hidden;
  background:var(--win);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:relative}
@media (max-width:560px){
  body{display:block}
  .window{width:100vw;height:100dvh;border-radius:0;border:0;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
}

/* заголовок окна */
.titlebar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--win)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.02em}
.brand svg{width:20px;height:20px;color:var(--accent-text)}
.brand .slashes{font-family:var(--mono);color:var(--accent-text)}
.grip{flex:1;text-align:center;color:var(--line2);letter-spacing:3px;user-select:none;font-size:12px}
.status{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.iconbtn{width:32px;height:32px;display:grid;place-items:center;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted);transition:.15s}
.iconbtn:hover,.iconbtn[aria-expanded="true"]{color:var(--text);background:var(--win2);border-color:var(--line)}
.iconbtn svg{width:18px;height:18px}
.iconbtn[hidden]{display:none}

/* вкладки структур */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none;background:var(--win)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:100px;border:1px solid var(--c-line);
  background:transparent;color:var(--c-text);font-weight:700;font-size:12px;letter-spacing:.03em;transition:.15s}
.tab .pip{width:7px;height:7px;border-radius:50%;background:var(--c-fill)}
.tab small{font-weight:500;color:var(--muted);font-size:10px}
.tab[aria-checked="true"]{background:var(--c-fill);color:var(--c-ink);border-color:var(--c-border-on,var(--c-fill));box-shadow:0 0 14px -4px var(--c-glow)}
.tab[aria-checked="true"] .pip{background:var(--c-ink)}
.tab[aria-checked="true"] small{color:inherit;opacity:.75}
.tabs.nudge{animation:nudge .45s}
@keyframes nudge{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* настройки */
.settings{border-bottom:1px solid var(--line);background:var(--win2);padding:12px;display:grid;gap:12px}
.settings[hidden]{display:none}
.row{display:grid;gap:6px}
.row>label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--win);color:var(--muted);font-size:13px;transition:.15s}
.seg button[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 16%,var(--win))}
.info{font-size:12px;color:var(--muted)}
.info b{color:var(--accent-text)}

/* лента сообщений */
.feed{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;overscroll-behavior:contain}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:300px}
.empty b{display:block;font-size:15px;color:var(--text);margin-bottom:4px;font-family:var(--mono);font-weight:600}
.user{align-self:flex-end;max-width:86%;background:var(--accent);color:var(--accent-ink);padding:9px 13px;border-radius:14px 14px 4px 14px;
  overflow-wrap:anywhere;white-space:pre-wrap;font-weight:500}
.bot{align-self:flex-start;width:100%;display:grid;gap:8px}
.bot-head{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.06em;font-weight:800;color:var(--accent-text)}
.bot-head .tag{font-weight:600;color:var(--muted);letter-spacing:.04em;border:1px solid var(--line);border-radius:100px;padding:1px 8px}
.card{background:var(--win2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:grid;gap:7px;overflow-wrap:anywhere}
.card.error{border-color:var(--bad);color:var(--bad)}
.line{display:grid;gap:1px}
.line .k{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-text)}
.line .v{white-space:pre-wrap}
.plain{white-space:pre-wrap}
.note{font-size:12px;border-left:2px solid var(--note);padding:2px 0 2px 9px;color:var(--note)}
.understand{font-size:12px;color:var(--muted);border-left:2px solid var(--accent);padding:2px 0 2px 9px;overflow-wrap:anywhere}
.understand b{color:var(--text);font-weight:600}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bounce 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}

/* источники */
.srcs>summary,.src>summary{cursor:pointer;list-style:none}
.srcs>summary::-webkit-details-marker,.src>summary::-webkit-details-marker{display:none}
.srcs>summary{font-size:12px;font-weight:700;color:var(--muted);padding:2px 0;display:flex;align-items:center;gap:6px}
.srcs>summary::before{content:"▸";transition:transform .15s;color:var(--accent-text)}
.srcs[open]>summary::before{transform:rotate(90deg)}
.srclist{display:grid;gap:6px;margin-top:6px}
.src{border:1px solid var(--line);border-radius:10px;background:var(--win);padding:8px 10px}
.src-title{font-weight:600;font-size:13px}
.src-meta{font-size:11px;color:var(--muted)}
.src-body{margin-top:8px;font-size:12px;color:var(--muted);white-space:pre-wrap;max-height:240px;overflow:auto;overflow-wrap:anywhere}
.src a{color:var(--accent-text);font-size:12px;display:inline-block;margin-top:6px}

/* поле ввода */
.composer{border-top:1px solid var(--line);padding:10px 12px 12px;background:var(--win)}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--win2);border:1px solid var(--line2);border-radius:14px;padding:6px 6px 6px 12px;transition:.15s}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;max-height:140px;min-height:24px;padding:6px 0;line-height:1.45}
textarea::placeholder{color:var(--muted)}
.send{width:38px;height:38px;flex:0 0 auto;border:0;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:opacity .15s}
.send:disabled{opacity:.45}
.send svg{width:18px;height:18px}
.hint{font-size:11px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px;min-height:16px}
.hint.warn{color:var(--bad)}
.hint .kbd{display:none}
@media (hover:hover) and (pointer:fine){.hint .kbd{display:inline}}
.spin{width:16px;height:16px;border:2px solid color-mix(in srgb,var(--accent-ink) 30%,transparent);border-top-color:var(--accent-ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="window" id="window" aria-label="LEX Blaine">
  <header class="titlebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v16M6 7h12M6 7l-3 7h6zM18 7l-3 7h6zM8 21h8"/></svg>
      <span><span class="slashes">//</span>LEX</span>
    </div>
    <div class="grip" aria-hidden="true">⋮⋮⋮</div>
    <div class="status" title="Состояние сервиса"><span class="dot" id="statusDot"></span><span id="statusText">…</span></div>
    <button class="iconbtn" id="newDialog" type="button" title="Новый диалог" aria-label="Новый диалог" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4v4h4"/></svg>
    </button>
    <button class="iconbtn" id="themeBtn" type="button" title="Сменить тему" aria-label="Сменить тему"></button>
    <button class="iconbtn" id="settingsBtn" type="button" title="Настройки поиска" aria-label="Настройки поиска" aria-expanded="false" aria-controls="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <nav class="tabs" id="tabs" role="radiogroup" aria-label="Выберите структуру"></nav>

  <section class="settings" id="settings" hidden>
    <div class="row"><label>Глубина поиска</label>
      <div class="seg" id="modeSeg">
        <button type="button" data-mode="fast" aria-pressed="false">Быстрый</button>
        <button type="button" data-mode="deep" aria-pressed="false">Углублённый</button>
        <button type="button" data-mode="auto" aria-pressed="true">Авто</button>
      </div></div>
    <div class="row"><label>Подробность ответа</label>
      <div class="seg" id="detailSeg">
        <button type="button" data-detail="concise" aria-pressed="true">Краткий</button>
        <button type="button" data-detail="detailed" aria-pressed="false">Развёрнутый</button>
      </div></div>
    <div class="row"><label>Тема</label>
      <div class="seg" id="themeSeg">
        <button type="button" data-theme-pref="auto" aria-pressed="true">Авто</button>
        <button type="button" data-theme-pref="light" aria-pressed="false">Светлая</button>
        <button type="button" data-theme-pref="dark" aria-pressed="false">Тёмная</button>
      </div></div>
    <div class="info" id="structInfo">Поиск идёт только по документам выбранной структуры.</div>
  </section>

  <div class="feed" id="feed" aria-live="polite">
    <div class="empty" id="empty"><b>Ожидание запроса…</b>Выберите структуру и опишите ситуацию или введите номер статьи.</div>
  </div>

  <form class="composer" id="askForm" autocomplete="off">
    <div class="box">
      <textarea id="question" rows="1" maxlength="2000" required placeholder="Опишите ситуацию или введите запрос…" aria-label="Ваш вопрос"></textarea>
      <button class="send" id="sendBtn" type="submit" aria-label="Отправить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="hint" id="hint"><span id="hintText"></span><span class="kbd">Enter — отправить · Shift+Enter — новая строка</span></div>
  </form>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);

  // Структуры. fill/ink: заливка активной вкладки и цвет текста на ней; text: цвет названия на тёмной теме,
  // textLight: на светлой; accent: цвет пузыря, кнопки и подсветки.
  const STRUCTURES = [
    {id:'sang',        name:'SANG',        fill:'#4cc35a', ink:'#06210b', text:'#6fdc7c', textLight:'#1f8a2e', line:'#2f6a38', accent:'#4cc35a'},
    {id:'lspd',        name:'LSPD',        fill:'#4fc3f7', ink:'#04202e', text:'#6fd3ff', textLight:'#0b78ad', line:'#2a6580', accent:'#4fc3f7'},
    {id:'fib',         name:'FIB',         fill:'#3d6bff', ink:'#ffffff', text:'#7b9cff', textLight:'#2447c9', line:'#2f4aa8', accent:'#5b83ff'},
    {id:'lssd',        name:'LSSD',        fill:'#ffae1a', ink:'#2a1a00', text:'#ffbf47', textLight:'#a65f00', line:'#7a5510', accent:'#ffae1a'},
    {id:'usss',        name:'USSS',        fill:'#e5484d', ink:'#ffffff', text:'#ff7a7e', textLight:'#c0292e', line:'#7d2a2d', accent:'#ef5a5f'},
    {id:'advokatura',  name:'Адвокатура',  fill:'#000000', ink:'#ffffff', text:'#f2f3f6', textLight:'#14161c', line:'#3b3f4a', accent:null, black:true},
    {id:'prokuratura', name:'Прокуратура', fill:'#000000', ink:'#ffffff', text:'#f2f3f6', textLight:'#14161c', line:'#3b3f4a', accent:null, black:true}
  ];
  const INTENTS = {power:'вопрос о полномочиях', procedure:'порядок действий', penalty:'наказание', comparison:'сравнение норм', definition:'определение', article:'поиск статьи'};
  const byId = id => STRUCTURES.find(s => s.id === id);

  let mode = 'auto', detail = 'concise', current = '';
  let history = [];          // последние реплики: уходят на сервер, чтобы работали уточнения («а сколько за это дают?»)
  let busy = false;
  let serverInfo = {};

  const store = {
    get(k){ try { return localStorage.getItem(k) || ''; } catch(_) { return ''; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(_) {} }
  };
  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // ---------- тема ----------
  const darkQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  let themePref = ['auto','light','dark'].includes(store.get('lex_theme')) ? store.get('lex_theme') : 'auto';
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function resolvedTheme(){ return themePref === 'auto' ? (darkQuery && !darkQuery.matches ? 'light' : 'dark') : themePref; }
  function applyTheme(){
    const theme = resolvedTheme();
    document.documentElement.dataset.theme = theme;
    $('themeColor').setAttribute('content', theme === 'light' ? '#ffffff' : '#111319');
    $('themeBtn').innerHTML = theme === 'light' ? MOON : SUN;   // иконка показывает, на какую тему переключит
    document.querySelectorAll('[data-theme-pref]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themePref === themePref)));
    applyAccent();
    renderTabs();
  }
  function setTheme(pref){ themePref = pref; store.set('lex_theme', pref); applyTheme(); }
  if (darkQuery && darkQuery.addEventListener) darkQuery.addEventListener('change', () => { if (themePref === 'auto') applyTheme(); });
  $('themeBtn').addEventListener('click', () => setTheme(resolvedTheme() === 'light' ? 'dark' : 'light'));
  document.querySelectorAll('[data-theme-pref]').forEach(b => b.addEventListener('click', () => setTheme(b.dataset.themePref)));

  // ---------- акцент выбранной структуры ----------
  function applyAccent(){
    const s = byId(current), light = resolvedTheme() === 'light', root = document.documentElement.style;
    let accent, ink, text;
    if (!s){ accent = light ? '#20242c' : '#d9dce3'; ink = light ? '#ffffff' : '#101114'; text = light ? '#20242c' : '#d9dce3'; }
    else if (s.black){ accent = light ? '#14161c' : '#d9dce3'; ink = light ? '#ffffff' : '#101114'; text = light ? s.textLight : s.text; }
    else { accent = s.accent; ink = s.ink; text = light ? s.textLight : s.text; }
    root.setProperty('--accent', accent); root.setProperty('--accent-ink', ink); root.setProperty('--accent-text', text);
  }

  // ---------- вкладки структур ----------
  function renderTabs(){
    const box = $('tabs'); box.replaceChildren();
    const light = resolvedTheme() === 'light';
    STRUCTURES.forEach(s => {
      const b = el('button', 'tab'); b.type = 'button'; b.dataset.id = s.id;
      b.setAttribute('role', 'radio'); b.setAttribute('aria-checked', String(s.id === current));
      b.style.setProperty('--c-fill', s.fill); b.style.setProperty('--c-ink', s.ink);
      b.style.setProperty('--c-text', light ? s.textLight : s.text); b.style.setProperty('--c-line', light ? 'var(--line2)' : s.line);
      b.style.setProperty('--c-glow', s.black ? '#ffffff55' : s.fill);
      if (s.black && !light) b.style.setProperty('--c-border-on', '#f2f3f6');
      b.appendChild(el('span', 'pip')); b.appendChild(el('span', '', s.name));
      if (serverInfo[s.id] && serverInfo[s.id].ready === false) b.appendChild(el('small', '', 'скоро'));
      b.addEventListener('click', () => select(s.id));
      box.appendChild(b);
    });
  }
  function updateInfo(){
    const box = $('structInfo'); box.replaceChildren();
    const s = byId(current);
    if (!s){ box.textContent = 'Поиск идёт только по документам выбранной структуры.'; return; }
    const info = serverInfo[s.id] || {};
    box.appendChild(el('b', '', s.name));
    if (info.full_name) box.appendChild(document.createTextNode(' · ' + info.full_name));
    if (info.ready === false) box.appendChild(document.createTextNode(' · база пока не подключена'));
    else if (info.documents) box.appendChild(document.createTextNode(' · документов в базе: ' + info.documents));
  }
  function select(id){
    if (current !== id && history.length) resetDialog();
    current = id; store.set('lex_structure', id);
    document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-checked', String(t.dataset.id === id)));
    applyAccent(); updateInfo(); setHint('');
  }

  // ---------- настройки ----------
  $('settingsBtn').addEventListener('click', () => {
    const box = $('settings'), open = box.hidden;
    box.hidden = !open; $('settingsBtn').setAttribute('aria-expanded', String(open));
  });
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    mode = b.dataset.mode; document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));
  document.querySelectorAll('[data-detail]').forEach(b => b.addEventListener('click', () => {
    detail = b.dataset.detail; document.querySelectorAll('[data-detail]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  }));

  function setHint(text, warn){ $('hintText').textContent = text; $('hint').classList.toggle('warn', !!warn); }

  // ---------- сообщения ----------
  const feed = $('feed');
  function scrollDown(){ requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; }); }
  function hideEmpty(){ const e = $('empty'); if (e) e.remove(); }

  function addUser(text){ hideEmpty(); feed.appendChild(el('div', 'user', text)); scrollDown(); }
  function addTyping(structureName){
    hideEmpty();
    const wrap = el('div', 'bot');
    wrap.appendChild(el('div', 'bot-head', structureName));
    const card = el('div', 'card'); const t = el('div', 'typing'); t.append(el('i'), el('i'), el('i')); card.appendChild(t);
    wrap.appendChild(card); feed.appendChild(wrap); scrollDown(); return wrap;
  }

  // Ответ приходит текстом: «• Суть: …», «• Закон: …». Разбираем по строкам и безопасно показываем через textContent.
  function renderAnswerInto(card, answer){
    const lines = String(answer || '').split('\n').map(l => l.trim()).filter(Boolean);
    let shown = 0;
    lines.forEach(line => {
      const m = line.match(/^[•\-–]\s*([^:]{2,26}):\s*(.*)$/);
      if (/^(ℹ️|⚠)/.test(line)) { card.appendChild(el('div', 'note', line)); }
      else if (m) { const row = el('div', 'line'); row.appendChild(el('div', 'k', m[1])); row.appendChild(el('div', 'v', m[2])); card.appendChild(row); }
      else { card.appendChild(el('div', 'plain', line.replace(/^[•\-–]\s*/, ''))); }
      shown++;
    });
    if (!shown) card.appendChild(el('div', 'plain', 'Ответ не получен.'));
  }

  function renderSource(source){
    const card = el('details', 'src');
    const sum = el('summary');
    sum.appendChild(el('div', 'src-title', source.title || 'Источник'));
    const meta = [source.document, source.article ? 'Статья ' + source.article : '', source.mention_only ? 'Упоминание, не текст статьи' : ''].filter(Boolean).join(' · ');
    if (meta) sum.appendChild(el('div', 'src-meta', meta));
    card.appendChild(sum);
    const body = el('div', 'src-body', (source.text || '').slice(0, 1800));
    card.appendChild(body);
    if (source.url && /^https?:\/\//i.test(source.url)) {
      const link = el('a', '', 'Открыть источник'); link.href = source.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
      card.appendChild(link);
    }
    return card;
  }

  function fillBot(wrap, s, data){
    wrap.replaceChildren();
    const head = el('div', 'bot-head', s.name);
    const tagText = (data.effective_mode || mode).toUpperCase() + (data.cached ? ' · КЭШ' : '');
    head.appendChild(el('span', 'tag', tagText)); wrap.appendChild(head);
    const card = el('div', 'card'); renderAnswerInto(card, data.answer); wrap.appendChild(card);
    const u = data.understanding;
    if (u && (u.standalone || u.intent)) {
      const box = el('div', 'understand'); box.appendChild(el('b', '', 'Понял так: ')); box.appendChild(document.createTextNode(u.standalone || ''));
      const bits = []; if (u.intent && INTENTS[u.intent]) bits.push(INTENTS[u.intent]); if (u.subject) bits.push('кто: ' + u.subject);
      if (bits.length) box.appendChild(document.createTextNode(' (' + bits.join(', ') + ')'));
      wrap.appendChild(box);
    }
    const sources = data.sources || [];
    const det = el('details', 'srcs');
    det.appendChild(el('summary', '', sources.length ? 'Источники · ' + sources.length : 'Подтверждённые источники не найдены'));
    if (sources.length) { const list = el('div', 'srclist'); sources.forEach(src => list.appendChild(renderSource(src))); det.appendChild(list); }
    wrap.appendChild(det);
  }
  function fillError(wrap, s, message){
    wrap.replaceChildren(); wrap.appendChild(el('div', 'bot-head', s.name));
    wrap.appendChild(el('div', 'card error', message || 'Ошибка запроса.'));
  }

  function resetDialog(){
    history = []; $('newDialog').hidden = true;
    feed.replaceChildren();
    const empty = el('div', 'empty'); empty.id = 'empty';
    empty.appendChild(el('b', '', 'Ожидание запроса…'));
    empty.appendChild(document.createTextNode('Выберите структуру и опишите ситуацию или введите номер статьи.'));
    feed.appendChild(empty);
  }
  $('newDialog').addEventListener('click', () => { resetDialog(); $('question').value = ''; autosize(); $('question').focus(); });

  // ---------- отправка ----------
  async function submit(){
    if (busy) return;
    const question = $('question').value.trim();
    if (!question) return;
    if (!current){
      setHint('Сначала выберите структуру', true);
      const box = $('tabs'); box.classList.remove('nudge'); void box.offsetWidth; box.classList.add('nudge');
      return;
    }
    const s = byId(current);
    busy = true; $('sendBtn').disabled = true; $('sendBtn').replaceChildren(el('span', 'spin')); setHint('');
    addUser(question); $('question').value = ''; autosize();
    const wrap = addTyping(s.name);
    try {
      const response = await fetch('/api/ask', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question, mode, detail, structure: current, history: history.slice(-3)})
      });
      let data = {}; try { data = await response.json(); } catch(_) {}
      if (!response.ok) throw new Error(data.detail || 'Не удалось выполнить запрос. Попробуйте ещё раз.');
      fillBot(wrap, s, data);
      history.push({q: question, a: (data.answer || '').slice(0, 600)}); history = history.slice(-3);
      $('newDialog').hidden = false;
    } catch (error) {
      fillError(wrap, s, error.message);
    } finally {
      busy = false; $('sendBtn').disabled = false;
      $('sendBtn').innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
      scrollDown();
    }
  }
  $('askForm').addEventListener('submit', event => { event.preventDefault(); submit(); });

  // На телефоне Enter переносит строку (отправка кнопкой), на компьютере Enter отправляет.
  const touchOnly = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  $('question').addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && !touchOnly) { event.preventDefault(); submit(); }
    else if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) { event.preventDefault(); submit(); }
  });
  function autosize(){ const t = $('question'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
  $('question').addEventListener('input', () => { autosize(); if ($('hint').classList.contains('warn') && current) setHint(''); });

  // ---------- статус и список структур ----------
  async function checkStatus(){
    try {
      const r = await fetch('/api/status'); const data = await r.json();
      if (!r.ok) throw new Error('status');
      const bad = data.groq_configured === false;
      $('statusText').textContent = bad ? 'нет ИИ' : 'онлайн';
      $('statusDot').style.background = bad ? 'var(--bad)' : 'var(--ok)';
    } catch(_) { $('statusText').textContent = 'нет связи'; $('statusDot').style.background = 'var(--bad)'; }
  }
  async function loadStructures(){
    try {
      const r = await fetch('/api/structures'); if (!r.ok) return;
      const data = await r.json();
      (data.structures || []).forEach(s => { serverInfo[s.id] = s; });
      renderTabs(); updateInfo();
    } catch(_) { /* без сети остаются вкладки по умолчанию */ }
  }

  // ---------- старт ----------
  const saved = store.get('lex_structure');
  if (byId(saved)) current = saved;
  applyTheme(); updateInfo(); autosize(); checkStatus(); loadStructures();
})();
</script>
</body>
</html>
