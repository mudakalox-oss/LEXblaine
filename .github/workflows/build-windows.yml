name: Build Bcore for Windows

# Этот файл сам создаёт все файлы приложения и собирает Bcore.exe.
# Запуск: при изменении этого файла или вручную (Actions -> Run workflow).

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:

      - name: Write Cargo.toml
        shell: bash
        run: |
          mkdir -p windows-app/src-tauri
          cat > windows-app/src-tauri/Cargo.toml <<'BCORE_EOF'
          [package]
          name = "bcore"
          version = "1.1.0"
          edition = "2021"

          [build-dependencies]
          tauri-build = { version = "2", features = [] }

          [dependencies]
          tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
          tauri-plugin-global-shortcut = "2"
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          ureq = "2"

          [features]
          default = ["custom-protocol"]
          custom-protocol = ["tauri/custom-protocol"]

          [profile.release]
          opt-level = "s"
          lto = true
          codegen-units = 1
          panic = "abort"
          strip = true
          BCORE_EOF

      - name: Write build.rs
        shell: bash
        run: |
          mkdir -p windows-app/src-tauri
          cat > windows-app/src-tauri/build.rs <<'BCORE_EOF'
          fn main() {
              tauri_build::build()
          }
          BCORE_EOF

      - name: Write tauri.conf.json
        shell: bash
        run: |
          mkdir -p windows-app/src-tauri
          cat > windows-app/src-tauri/tauri.conf.json <<'BCORE_EOF'
          {
            "$schema": "https://schema.tauri.app/config/2",
            "productName": "Bcore",
            "version": "1.1.0",
            "identifier": "com.bcore.overlay",
            "build": {
              "frontendDist": "../ui"
            },
            "app": {
              "withGlobalTauri": true,
              "windows": [
                {
                  "label": "main",
                  "title": "Bcore",
                  "url": "index.html",
                  "width": 900,
                  "height": 700,
                  "minWidth": 320,
                  "minHeight": 400,
                  "alwaysOnTop": true
                }
              ],
              "security": { "csp": null }
            },
            "bundle": {
              "active": false,
              "icon": ["icons/icon.ico", "icons/icon.png"]
            }
          }
          BCORE_EOF

      - name: Write default.json
        shell: bash
        run: |
          mkdir -p windows-app/src-tauri/capabilities
          cat > windows-app/src-tauri/capabilities/default.json <<'BCORE_EOF'
          {
            "$schema": "../gen/schemas/desktop-schema.json",
            "identifier": "default",
            "description": "LEX Blaine windows",
            "windows": ["main", "settings"],
            "permissions": ["core:default"]
          }
          BCORE_EOF

      - name: Write main.rs
        shell: bash
        run: |
          mkdir -p windows-app/src-tauri/src
          cat > windows-app/src-tauri/src/main.rs <<'BCORE_EOF'
          // Скрываем консольное окно в релизной сборке Windows.
          #![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]

          use std::{fs, io::Read, path::PathBuf, process::Command, sync::Mutex, time::Duration};

          use serde::{Deserialize, Serialize};
          use tauri::{
              menu::{CheckMenuItem, Menu, MenuItem},
              tray::{MouseButton, MouseButtonState, TrayIconBuilder, TrayIconEvent},
              AppHandle, LogicalSize, Manager, State, WebviewUrl, WebviewWindow, WebviewWindowBuilder,
              WindowEvent, Wry,
          };
          use tauri_plugin_global_shortcut::{GlobalShortcutExt, Shortcut, ShortcutState};

          /// Адрес сервера. Ключ Groq остаётся только на нём.
          const SITE: &str = "https://lexblaine.onrender.com";
          /// Репозиторий, из раздела Releases которого берутся обновления (должен быть публичным).
          const GH_REPO: &str = "mudakalox-oss/LEXblaine";
          const TITLE: &str = "Bcore";
          const MINI_SIZE: (f64, f64) = (380.0, 560.0);
          const NORMAL_SIZE: (f64, f64) = (900.0, 700.0);
          const MIN_OPACITY: u8 = 10; // ниже окно невозможно найти, чтобы вернуть обратно

          /// Номер сборки подставляет GitHub Actions (переменная BCORE_BUILD). Локально 0, обновления отключены.
          fn current_build() -> u64 {
              option_env!("BCORE_BUILD").and_then(|s| s.parse().ok()).unwrap_or(0)
          }

          #[derive(Clone, Serialize, Deserialize)]
          #[serde(default)]
          struct Settings {
              hotkey: String,
              click_hotkey: String,
              opacity: u8,
              mini: bool,
              on_top: bool,
              auto_update: bool,
              keep_alive: bool,
          }

          impl Default for Settings {
              fn default() -> Self {
                  Settings {
                      hotkey: "F5".into(),
                      click_hotkey: "Shift+F5".into(),
                      opacity: 100,
                      mini: false,
                      on_top: true,
                      auto_update: true,
                      keep_alive: true,
                  }
              }
          }

          #[derive(Serialize)]
          struct SettingsView {
              #[serde(flatten)]
              settings: Settings,
              build: u64,
              click: bool,
          }

          struct AppState {
              settings: Mutex<Settings>,
              click: Mutex<bool>,
              click_item: Mutex<Option<CheckMenuItem<Wry>>>,
              update: Mutex<Option<(u64, String)>>,
          }

          // ---------- хранение настроек ----------

          fn config_path(app: &AppHandle) -> Option<PathBuf> {
              app.path().app_config_dir().ok().map(|d| d.join("settings.json"))
          }

          fn load_settings(app: &AppHandle) -> Settings {
              config_path(app)
                  .and_then(|p| fs::read_to_string(p).ok())
                  .and_then(|t| serde_json::from_str::<Settings>(&t).ok())
                  .map(|mut s| {
                      s.opacity = s.opacity.clamp(MIN_OPACITY, 100);
                      s
                  })
                  .unwrap_or_default()
          }

          fn save_settings(app: &AppHandle, s: &Settings) {
              if let Some(p) = config_path(app) {
                  if let Some(dir) = p.parent() {
                      let _ = fs::create_dir_all(dir);
                  }
                  if let Ok(text) = serde_json::to_string_pretty(s) {
                      let _ = fs::write(p, text);
                  }
              }
          }

          // ---------- прозрачность окна (Win32, без лишних зависимостей) ----------

          #[cfg(windows)]
          mod win {
              #[link(name = "user32")]
              extern "system" {
                  pub fn GetWindowLongPtrW(hwnd: isize, index: i32) -> isize;
                  pub fn SetWindowLongPtrW(hwnd: isize, index: i32, value: isize) -> isize;
                  pub fn SetLayeredWindowAttributes(hwnd: isize, key: u32, alpha: u8, flags: u32) -> i32;
              }
              pub const GWL_EXSTYLE: i32 = -20;
              pub const WS_EX_LAYERED: isize = 0x0008_0000;
              pub const LWA_ALPHA: u32 = 0x2;
          }

          /// `keep_layered` нужен при сквозном клике: без слоя Windows перестаёт пропускать клики.
          #[cfg(windows)]
          fn apply_opacity(w: &WebviewWindow, percent: u8, keep_layered: bool) {
              if let Ok(hwnd) = w.hwnd() {
                  let h = hwnd.0 as isize;
                  unsafe {
                      let ex = win::GetWindowLongPtrW(h, win::GWL_EXSTYLE);
                      if percent >= 100 && !keep_layered {
                          // Полная непрозрачность: слой не нужен, меньше нагрузки.
                          win::SetWindowLongPtrW(h, win::GWL_EXSTYLE, ex & !win::WS_EX_LAYERED);
                      } else {
                          win::SetWindowLongPtrW(h, win::GWL_EXSTYLE, ex | win::WS_EX_LAYERED);
                          let alpha = (percent.min(100) as u32 * 255 / 100) as u8;
                          win::SetLayeredWindowAttributes(h, 0, alpha, win::LWA_ALPHA);
                      }
                  }
              }
          }

          #[cfg(not(windows))]
          fn apply_opacity(_w: &WebviewWindow, _percent: u8, _keep_layered: bool) {}

          fn apply_window(w: &WebviewWindow, s: &Settings) {
              let _ = w.set_always_on_top(s.on_top);
              let (width, height) = if s.mini { MINI_SIZE } else { NORMAL_SIZE };
              let _ = w.set_size(LogicalSize::new(width, height));
              apply_opacity(w, s.opacity, false);
          }

          // ---------- окна ----------

          fn toggle_main(app: &AppHandle) {
              if let Some(w) = app.get_webview_window("main") {
                  let visible = w.is_visible().unwrap_or(false);
                  let minimized = w.is_minimized().unwrap_or(false);
                  if visible && !minimized {
                      let _ = w.hide();
                  } else {
                      let _ = w.show();
                      let _ = w.unminimize();
                      // В режиме сквозного клика фокус не забираем: игра остаётся активной.
                      if !*app.state::<AppState>().click.lock().unwrap() {
                          let _ = w.set_focus();
                      }
                  }
              }
          }

          fn set_click_through(app: &AppHandle, on: bool) {
              let st = app.state::<AppState>();
              *st.click.lock().unwrap() = on;
              if let Some(w) = app.get_webview_window("main") {
                  let _ = w.set_ignore_cursor_events(on);
                  // Системный вызов выше сбрасывает слой окна, поэтому прозрачность задаём заново.
                  let pct = st.settings.lock().unwrap().opacity;
                  apply_opacity(&w, pct, on);
                  let _ = w.set_title(&if on { format!("{TITLE} · сквозной клик") } else { TITLE.to_string() });
                  if on {
                      let _ = w.show();
                  }
              }
              let item = st.click_item.lock().unwrap().clone();
              if let Some(item) = item {
                  let _ = item.set_checked(on);
              }
          }

          fn toggle_click_through(app: &AppHandle) {
              let now = *app.state::<AppState>().click.lock().unwrap();
              set_click_through(app, !now);
          }

          fn open_settings(app: &AppHandle) {
              if let Some(w) = app.get_webview_window("settings") {
                  let _ = w.show();
                  let _ = w.set_focus();
                  return;
              }
              // Создание окон делаем не в потоке событий, чтобы не получить взаимную блокировку на Windows.
              let handle = app.clone();
              tauri::async_runtime::spawn(async move {
                  let _ = WebviewWindowBuilder::new(&handle, "settings", WebviewUrl::App("settings.html".into()))
                      .title("Настройки Bcore")
                      .inner_size(460.0, 700.0)
                      .resizable(true)
                      .always_on_top(true)
                      .build();
              });
          }

          // ---------- горячие клавиши ----------

          fn busy<E: std::fmt::Display>(e: E) -> String {
              format!("Не удалось занять клавишу (возможно, её использует другая программа): {e}")
          }

          fn register_all(app: &AppHandle, main_key: &str, click_key: &str) -> Result<(), String> {
              let a: Shortcut = main_key.parse().map_err(|e| format!("Неверное сочетание клавиш: {e}"))?;
              let b: Shortcut = click_key.parse().map_err(|e| format!("Неверное сочетание клавиш: {e}"))?;
              if a == b {
                  return Err("Две горячие клавиши должны отличаться.".into());
              }
              let gs = app.global_shortcut();
              let _ = gs.unregister_all();
              gs.on_shortcut(a.clone(), |app, _sc, event| {
                  if event.state() == ShortcutState::Pressed {
                      toggle_main(app);
                  }
              })
              .map_err(busy)?;
              if let Err(e) = gs.on_shortcut(b.clone(), |app, _sc, event| {
                  if event.state() == ShortcutState::Pressed {
                      toggle_click_through(app);
                  }
              }) {
                  let _ = gs.unregister_all();
                  return Err(busy(e));
              }
              Ok(())
          }

          fn register_current(app: &AppHandle) -> Result<(), String> {
              let (m, c) = {
                  let s = app.state::<AppState>();
                  let s = s.settings.lock().unwrap();
                  (s.hotkey.clone(), s.click_hotkey.clone())
              };
              register_all(app, &m, &c)
          }

          // ---------- обновления ----------

          /// Самая свежая сборка из Releases: (номер, ссылка на Bcore.exe).
          fn fetch_latest() -> Option<(u64, String)> {
              let url = format!("https://api.github.com/repos/{GH_REPO}/releases?per_page=15");
              let text = ureq::get(&url)
                  .set("User-Agent", "Bcore-updater")
                  .set("Accept", "application/vnd.github+json")
                  .timeout(Duration::from_secs(10))
                  .call()
                  .ok()?
                  .into_string()
                  .ok()?;
              let v: serde_json::Value = serde_json::from_str(&text).ok()?;
              let mut best: Option<(u64, String)> = None;
              for r in v.as_array()? {
                  if r["draft"].as_bool() == Some(true) || r["prerelease"].as_bool() == Some(true) {
                      continue;
                  }
                  let n = match r["tag_name"].as_str().and_then(|t| t.strip_prefix("app-")).and_then(|n| n.parse::<u64>().ok()) {
                      Some(n) => n,
                      None => continue,
                  };
                  for a in r["assets"].as_array().into_iter().flatten() {
                      if a["name"].as_str() == Some("Bcore.exe") {
                          if let Some(link) = a["browser_download_url"].as_str() {
                              if best.as_ref().map_or(true, |(b, _)| n > *b) {
                                  best = Some((n, link.to_string()));
                              }
                          }
                      }
                  }
              }
              best
          }

          /// Скачивает новую версию рядом с текущей, проверяет файл, подменяет и запускает.
          /// Запущенный exe нельзя перезаписать, но можно переименовать: так и делаем.
          fn do_install(url: &str) -> Result<(), String> {
              let exe = std::env::current_exe().map_err(|e| e.to_string())?;
              let new = exe.with_extension("new");
              let old = exe.with_extension("old");

              let resp = ureq::get(url)
                  .set("User-Agent", "Bcore-updater")
                  .timeout(Duration::from_secs(180))
                  .call()
                  .map_err(|e| format!("Не удалось скачать обновление: {e}"))?;
              {
                  let mut reader = resp.into_reader();
                  let mut file = fs::File::create(&new).map_err(|e| format!("Нет прав записи в папку приложения: {e}"))?;
                  std::io::copy(&mut reader, &mut file).map_err(|e| e.to_string())?;
              }

              // Простая проверка: это исполняемый файл Windows разумного размера.
              let size = fs::metadata(&new).map(|m| m.len()).unwrap_or(0);
              let mut head = [0u8; 2];
              let is_exe = fs::File::open(&new).and_then(|mut f| f.read_exact(&mut head)).is_ok() && &head == b"MZ";
              if size < 500_000 || !is_exe {
                  let _ = fs::remove_file(&new);
                  return Err("Скачанный файл повреждён, обновление отменено.".into());
              }

              let _ = fs::remove_file(&old);
              fs::rename(&exe, &old).map_err(|e| format!("Не удалось заменить файл: {e}"))?;
              if let Err(e) = fs::rename(&new, &exe) {
                  let _ = fs::rename(&old, &exe);
                  return Err(format!("Не удалось заменить файл: {e}"));
              }
              Command::new(&exe).spawn().map_err(|e| format!("Не удалось запустить новую версию: {e}"))?;
              Ok(())
          }

          fn note_update(app: &AppHandle, build: u64) {
              if let Some(tray) = app.tray_by_id("main") {
                  let _ = tray.set_tooltip(Some(format!("{TITLE}: доступно обновление (сборка {build})")));
              }
          }

          #[derive(Serialize)]
          struct UpdateStatus {
              current: u64,
              latest: Option<u64>,
              available: bool,
              failed: bool,
          }

          // ---------- команды для окон интерфейса ----------

          #[tauri::command]
          fn get_settings(state: State<AppState>) -> SettingsView {
              SettingsView {
                  settings: state.settings.lock().unwrap().clone(),
                  build: current_build(),
                  click: *state.click.lock().unwrap(),
              }
          }

          /// Пока пользователь нажимает новое сочетание в настройках, горячие клавиши отпускаем,
          /// иначе F5 перехватит сама программа и окно не услышит нажатие.
          #[tauri::command]
          fn hotkey_capture(app: AppHandle, start: bool) {
              if start {
                  let _ = app.global_shortcut().unregister_all();
              } else {
                  let _ = register_current(&app);
              }
          }

          /// which: "main" (показать/скрыть) или "click" (сквозной клик).
          #[tauri::command]
          fn set_hotkey(app: AppHandle, state: State<AppState>, which: String, hotkey: String) -> Result<Settings, String> {
              let (old_main, old_click) = {
                  let s = state.settings.lock().unwrap();
                  (s.hotkey.clone(), s.click_hotkey.clone())
              };
              let (m, c) = if which == "click" {
                  (old_main.clone(), hotkey.clone())
              } else {
                  (hotkey.clone(), old_click.clone())
              };
              if let Err(e) = register_all(&app, &m, &c) {
                  let _ = register_all(&app, &old_main, &old_click); // возвращаем прежние клавиши
                  return Err(e);
              }
              let mut s = state.settings.lock().unwrap();
              s.hotkey = m;
              s.click_hotkey = c;
              save_settings(&app, &s);
              Ok(s.clone())
          }

          #[tauri::command]
          fn set_opacity(app: AppHandle, state: State<AppState>, percent: u8) {
              let percent = percent.clamp(MIN_OPACITY, 100);
              {
                  let mut s = state.settings.lock().unwrap();
                  s.opacity = percent;
                  save_settings(&app, &s);
              }
              let click = *state.click.lock().unwrap();
              if let Some(w) = app.get_webview_window("main") {
                  apply_opacity(&w, percent, click);
              }
          }

          #[tauri::command]
          fn set_mini(app: AppHandle, state: State<AppState>, mini: bool) {
              let mut s = state.settings.lock().unwrap();
              s.mini = mini;
              save_settings(&app, &s);
              if let Some(w) = app.get_webview_window("main") {
                  let (width, height) = if mini { MINI_SIZE } else { NORMAL_SIZE };
                  let _ = w.set_size(LogicalSize::new(width, height));
              }
          }

          #[tauri::command]
          fn set_on_top(app: AppHandle, state: State<AppState>, on_top: bool) {
              let mut s = state.settings.lock().unwrap();
              s.on_top = on_top;
              save_settings(&app, &s);
              if let Some(w) = app.get_webview_window("main") {
                  let _ = w.set_always_on_top(on_top);
              }
          }

          /// Простые галочки: "auto_update" и "keep_alive".
          #[tauri::command]
          fn set_option(app: AppHandle, state: State<AppState>, key: String, value: bool) {
              let mut s = state.settings.lock().unwrap();
              match key.as_str() {
                  "auto_update" => s.auto_update = value,
                  "keep_alive" => s.keep_alive = value,
                  _ => return,
              }
              save_settings(&app, &s);
          }

          #[tauri::command]
          fn click_through(app: AppHandle, on: bool) {
              set_click_through(&app, on);
          }

          /// Проверка, проснулся ли сервер Render. Адрес зашит в программе, из окна его менять нельзя.
          #[tauri::command]
          async fn check_server() -> bool {
              tauri::async_runtime::spawn_blocking(|| {
                  ureq::get(&format!("{SITE}/health"))
                      .timeout(Duration::from_secs(8))
                      .call()
                      .map(|r| r.status() == 200)
                      .unwrap_or(false)
              })
              .await
              .unwrap_or(false)
          }

          #[tauri::command]
          fn site_url() -> &'static str {
              SITE
          }

          #[tauri::command]
          async fn check_update(app: AppHandle) -> UpdateStatus {
              let found = tauri::async_runtime::spawn_blocking(fetch_latest).await.unwrap_or(None);
              let cur = current_build();
              match found {
                  Some((n, url)) => {
                      let available = cur > 0 && n > cur;
                      if available {
                          *app.state::<AppState>().update.lock().unwrap() = Some((n, url));
                          note_update(&app, n);
                      }
                      UpdateStatus { current: cur, latest: Some(n), available, failed: false }
                  }
                  None => UpdateStatus { current: cur, latest: None, available: false, failed: true },
              }
          }

          #[tauri::command]
          async fn install_update(app: AppHandle) -> Result<(), String> {
              let url = app
                  .state::<AppState>()
                  .update
                  .lock()
                  .unwrap()
                  .as_ref()
                  .map(|(_, u)| u.clone())
                  .ok_or_else(|| "Обновление не найдено. Сначала проверьте наличие.".to_string())?;
              tauri::async_runtime::spawn_blocking(move || do_install(&url))
                  .await
                  .map_err(|e| e.to_string())??;
              app.exit(0);
              Ok(())
          }

          fn main() {
              tauri::Builder::default()
                  .plugin(tauri_plugin_global_shortcut::Builder::new().build())
                  .invoke_handler(tauri::generate_handler![
                      get_settings,
                      hotkey_capture,
                      set_hotkey,
                      set_opacity,
                      set_mini,
                      set_on_top,
                      set_option,
                      click_through,
                      check_server,
                      site_url,
                      check_update,
                      install_update
                  ])
                  .on_window_event(|window, event| match (window.label(), event) {
                      // Крестик на главном окне только прячет его в трей.
                      ("main", WindowEvent::CloseRequested { api, .. }) => {
                          api.prevent_close();
                          let _ = window.hide();
                      }
                      // Если окно настроек закрыли во время записи клавиши, возвращаем горячие клавиши.
                      ("settings", WindowEvent::Destroyed) => {
                          let _ = register_current(window.app_handle());
                      }
                      _ => {}
                  })
                  .setup(|app| {
                      let handle = app.handle().clone();

                      // Убираем хвосты прошлого обновления.
                      if let Ok(exe) = std::env::current_exe() {
                          let _ = fs::remove_file(exe.with_extension("old"));
                          let _ = fs::remove_file(exe.with_extension("new"));
                      }

                      let settings = load_settings(&handle);
                      app.manage(AppState {
                          settings: Mutex::new(settings.clone()),
                          click: Mutex::new(false),
                          click_item: Mutex::new(None),
                          update: Mutex::new(None),
                      });

                      if let Some(w) = app.get_webview_window("main") {
                          apply_window(&w, &settings);
                      }

                      // После обновления прежний процесс может ещё секунду держать клавиши: пробуем несколько раз.
                      let mut registered = false;
                      for _ in 0..6 {
                          if register_current(&handle).is_ok() {
                              registered = true;
                              break;
                          }
                          std::thread::sleep(Duration::from_millis(500));
                      }
                      if !registered {
                          // Клавиша занята: сразу открываем настройки, чтобы выбрать другую.
                          open_settings(&handle);
                      }

                      let toggle = MenuItem::with_id(app, "toggle", "Показать / скрыть", true, None::<&str>)?;
                      let click = CheckMenuItem::with_id(app, "click", "Сквозной клик", true, false, None::<&str>)?;
                      let sets = MenuItem::with_id(app, "settings", "Настройки", true, None::<&str>)?;
                      let quit = MenuItem::with_id(app, "quit", "Выход", true, None::<&str>)?;
                      let menu = Menu::with_items(app, &[&toggle, &click, &sets, &quit])?;
                      *app.state::<AppState>().click_item.lock().unwrap() = Some(click.clone());

                      let mut tray = TrayIconBuilder::with_id("main")
                          .tooltip(TITLE)
                          .menu(&menu)
                          .show_menu_on_left_click(false)
                          .on_menu_event(|app, event| match event.id.as_ref() {
                              "toggle" => toggle_main(app),
                              "click" => toggle_click_through(app),
                              "settings" => open_settings(app),
                              "quit" => app.exit(0),
                              _ => {}
                          })
                          .on_tray_icon_event(|tray, event| {
                              if let TrayIconEvent::Click {
                                  button: MouseButton::Left,
                                  button_state: MouseButtonState::Up,
                                  ..
                              } = event
                              {
                                  toggle_main(tray.app_handle());
                              }
                          });
                      if let Some(icon) = app.default_window_icon() {
                          tray = tray.icon(icon.clone());
                      }
                      tray.build(app)?;

                      // Автообновление: при запуске и затем раз в 6 часов (после запуска только отмечаем наличие).
                      let h = handle.clone();
                      std::thread::spawn(move || {
                          std::thread::sleep(Duration::from_secs(4));
                          let mut first = true;
                          loop {
                              if current_build() > 0 {
                                  if let Some((n, url)) = fetch_latest() {
                                      if n > current_build() {
                                          let st = h.state::<AppState>();
                                          *st.update.lock().unwrap() = Some((n, url.clone()));
                                          note_update(&h, n);
                                          let auto = st.settings.lock().unwrap().auto_update;
                                          if first && auto && do_install(&url).is_ok() {
                                              h.exit(0);
                                              return;
                                          }
                                      }
                                  }
                              }
                              first = false;
                              std::thread::sleep(Duration::from_secs(6 * 3600));
                          }
                      });

                      // Не даём бесплатному серверу Render уснуть, пока приложение запущено.
                      let h = handle.clone();
                      std::thread::spawn(move || loop {
                          std::thread::sleep(Duration::from_secs(9 * 60));
                          let on = h.state::<AppState>().settings.lock().unwrap().keep_alive;
                          if on {
                              let _ = ureq::get(&format!("{SITE}/health")).timeout(Duration::from_secs(10)).call();
                          }
                      });

                      Ok(())
                  })
                  .run(tauri::generate_context!())
                  .expect("ошибка запуска Bcore");
          }
          BCORE_EOF

      - name: Write index.html
        shell: bash
        run: |
          mkdir -p windows-app/ui
          cat > windows-app/ui/index.html <<'BCORE_EOF'
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><title>Bcore</title>
          <style>
          html,body{height:100%;margin:0;background:#0c0d11;color:#eef0f5;font:15px/1.5 "Segoe UI",system-ui,sans-serif}
          body{display:grid;place-items:center;text-align:center}
          svg{width:72px;height:72px;margin:0 auto 10px;display:block}
          .hex{fill:rgba(124,156,255,.14);stroke:#7c9cff;stroke-width:3;stroke-linejoin:round}
          .core{fill:none;stroke:#7c9cff;stroke-width:1.5;opacity:.4;stroke-linejoin:round}
          .b{fill:none;stroke:#eef0f5;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
          h1{font-size:15px;letter-spacing:.2em;margin:0 0 6px}
          p{color:#8f96a5;margin:4px 0;font-size:13px}
          .sp{width:18px;height:18px;border:2px solid #272b35;border-top-color:#7c9cff;border-radius:50%;margin:16px auto 0;animation:s .8s linear infinite}
          @keyframes s{to{transform:rotate(360deg)}}
          </style></head><body>
          <div>
          <svg viewBox="0 0 64 64" aria-hidden="true"><path class="hex" d="M32 4 56 18v28L32 60 8 46V18z"/><path class="core" d="M32 13 48 22.5v19L32 51 16 41.5v-19z"/><path class="b" d="M25 19v26M25 19h9.5a6.5 6.5 0 0 1 0 13H25m0 0h11a6.5 6.5 0 0 1 0 13H25"/></svg>
          <h1>BCORE</h1>
          <p id="msg">Подключение к серверу…</p><p id="sub"></p><div class="sp"></div></div>
          <script>
          (async () => {
            const t = window.__TAURI__;
            const msg = document.getElementById('msg'), sub = document.getElementById('sub');
            if (!t) { location.replace('https://lexblaine.onrender.com'); return; }
            const invoke = t.core.invoke;
            const site = await invoke('site_url');
            const started = Date.now();
            while (true) {
              let ok = false;
              try { ok = await invoke('check_server'); } catch (_) {}
              if (ok) { location.replace(site); return; }
              const sec = Math.round((Date.now() - started) / 1000);
              msg.textContent = 'Сервер просыпается…';
              sub.textContent = 'Бесплатный хостинг запускается до минуты. Прошло: ' + sec + ' с';
              await new Promise(r => setTimeout(r, 2500));
            }
          })();
          </script></body></html>
          BCORE_EOF

      - name: Write settings.html
        shell: bash
        run: |
          mkdir -p windows-app/ui
          cat > windows-app/ui/settings.html <<'BCORE_EOF'
          <!doctype html>
          <html lang="ru"><head><meta charset="utf-8"><title>Настройки Bcore</title>
          <style>
          html,body{margin:0;background:#0c0d11;color:#eef0f5;font:14px/1.5 "Segoe UI",system-ui,sans-serif}
          .wrap{padding:18px 20px 24px}
          h1{font-size:13px;letter-spacing:.16em;margin:0 0 4px}
          .ver{color:#6b7180;font-size:12px;margin-bottom:16px}
          h2{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#8f96a5;font-weight:700;margin:22px 0 10px;border-top:1px solid #272b35;padding-top:14px}
          h2:first-of-type{border-top:0;padding-top:0;margin-top:6px}
          .row{margin-bottom:14px}
          .label{font-size:12.5px;color:#c6cad6;margin-bottom:6px}
          .line{display:flex;align-items:center;gap:10px}
          button{background:#1a1d25;color:#eef0f5;border:1px solid #272b35;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
          button:hover{border-color:#7c9cff}
          button:disabled{opacity:.5;cursor:default}
          button.primary{background:#7c9cff;color:#0b1020;border-color:#7c9cff;font-weight:700}
          .key{flex:1;background:#0e1015;border:1px solid #30343f;border-radius:10px;padding:9px 12px;font-weight:700;letter-spacing:.04em}
          .key.listen{border-color:#7c9cff;color:#8f96a5;font-weight:500}
          input[type=range]{flex:1;accent-color:#7c9cff}
          #pct{width:48px;text-align:right;font-weight:700}
          label.chk{display:flex;align-items:center;gap:10px;cursor:pointer}
          .err{color:#ff8795;font-size:12.5px;margin-top:6px;min-height:16px}
          .note{color:#6b7180;font-size:12px;margin-top:4px}
          .ok{color:#72e2b5}
          </style></head><body><div class="wrap">
          <h1>BCORE · НАСТРОЙКИ</h1>
          <div class="ver" id="ver"></div>

          <h2>Горячие клавиши</h2>
          <div class="row"><div class="label">Показать / скрыть окно</div>
            <div class="line"><div class="key" id="key-main">—</div><button id="chg-main">Изменить</button></div></div>
          <div class="row"><div class="label">Сквозной клик (клики проходят в игру)</div>
            <div class="line"><div class="key" id="key-click">—</div><button id="chg-click">Изменить</button></div></div>
          <div class="err" id="err"></div>

          <h2>Окно</h2>
          <div class="row"><div class="label">Прозрачность</div>
            <div class="line"><input id="op" type="range" min="10" max="100" step="1"><span id="pct">100%</span></div>
            <div class="note">Минимум 10%, чтобы окно можно было найти.</div></div>
          <div class="row"><label class="chk"><input id="mini" type="checkbox"> Мини-режим (узкое окно)</label></div>
          <div class="row"><label class="chk"><input id="top" type="checkbox"> Поверх всех окон</label></div>
          <div class="row"><label class="chk"><input id="click" type="checkbox"> Сквозной клик сейчас</label>
            <div class="note">Выключить можно клавишей выше или в меню значка в трее.</div></div>

          <h2>Сервер</h2>
          <div class="row"><label class="chk"><input id="alive" type="checkbox"> Не давать серверу засыпать, пока приложение запущено</label></div>

          <h2>Обновления</h2>
          <div class="row"><label class="chk"><input id="auto" type="checkbox"> Устанавливать обновления автоматически при запуске</label></div>
          <div class="row"><div class="line"><button id="check">Проверить обновления</button><button id="install" class="primary" hidden>Установить и перезапустить</button></div>
            <div class="note" id="upd"></div></div>
          </div>
          <script>
          (async () => {
            const invoke = window.__TAURI__.core.invoke;
            const $ = id => document.getElementById(id);
            const pretty = a => a.replace(/Control/g,'Ctrl').replace(/Key([A-Z])/g,'$1').replace(/Digit(\d)/g,'$1').replace(/Super/g,'Win');
            let capturing = null; // 'main' | 'click'
            let prev = '';

            const s = await invoke('get_settings');
            $('key-main').textContent = pretty(s.hotkey);
            $('key-click').textContent = pretty(s.click_hotkey);
            $('op').value = s.opacity; $('pct').textContent = s.opacity + '%';
            $('mini').checked = s.mini; $('top').checked = s.on_top; $('click').checked = s.click;
            $('alive').checked = s.keep_alive; $('auto').checked = s.auto_update;
            $('ver').textContent = s.build > 0 ? 'Сборка ' + s.build : 'Локальная сборка (обновления отключены)';

            $('op').addEventListener('input', e => { const v = +e.target.value; $('pct').textContent = v + '%'; invoke('set_opacity', {percent: v}); });
            $('mini').addEventListener('change', e => invoke('set_mini', {mini: e.target.checked}));
            $('top').addEventListener('change', e => invoke('set_on_top', {onTop: e.target.checked}));
            $('click').addEventListener('change', e => invoke('click_through', {on: e.target.checked}));
            $('alive').addEventListener('change', e => invoke('set_option', {key: 'keep_alive', value: e.target.checked}));
            $('auto').addEventListener('change', e => invoke('set_option', {key: 'auto_update', value: e.target.checked}));

            async function stop(restore){
              const w = capturing; capturing = null;
              if (w) { $('key-' + w).classList.remove('listen'); $('chg-' + w).textContent = 'Изменить'; if (restore) $('key-' + w).textContent = prev; }
              await invoke('hotkey_capture', {start: false});
            }
            async function begin(which){
              if (capturing) await stop(true);
              capturing = which; $('err').textContent = '';
              prev = $('key-' + which).textContent;
              $('key-' + which).classList.add('listen'); $('key-' + which).textContent = 'Нажмите сочетание… (Esc — отмена)';
              $('chg-' + which).textContent = 'Отмена';
              await invoke('hotkey_capture', {start: true});
            }
            for (const w of ['main','click']) $('chg-' + w).addEventListener('click', async () => { if (capturing === w) await stop(true); else await begin(w); });

            window.addEventListener('keydown', async e => {
              if (!capturing) return;
              e.preventDefault();
              if (e.code === 'Escape') { await stop(true); return; }
              if (/^(Control|Shift|Alt|Meta)(Left|Right)$/.test(e.code)) return;
              const mods = [];
              if (e.ctrlKey) mods.push('Control'); if (e.altKey) mods.push('Alt');
              if (e.shiftKey) mods.push('Shift'); if (e.metaKey) mods.push('Super');
              const accel = mods.concat(e.code).join('+');
              const which = capturing; capturing = null;
              $('key-' + which).classList.remove('listen'); $('chg-' + which).textContent = 'Изменить';
              try {
                const res = await invoke('set_hotkey', {which, hotkey: accel});
                $('key-main').textContent = pretty(res.hotkey); $('key-click').textContent = pretty(res.click_hotkey); $('err').textContent = '';
              } catch (err) {
                $('key-' + which).textContent = prev; $('err').textContent = String(err);
              }
            });

            async function checkUpdate(){
              $('check').disabled = true; $('upd').className = 'note'; $('upd').textContent = 'Проверяю…'; $('install').hidden = true;
              try {
                const r = await invoke('check_update');
                if (r.failed) $('upd').textContent = 'Не удалось проверить (нет связи с GitHub или репозиторий закрыт).';
                else if (r.current === 0) $('upd').textContent = 'Локальная сборка: обновления отключены.';
                else if (r.available) { $('upd').textContent = 'Доступна сборка ' + r.latest + ' (у вас ' + r.current + ').'; $('install').hidden = false; }
                else { $('upd').className = 'note ok'; $('upd').textContent = 'У вас последняя версия.'; }
              } catch (e) { $('upd').textContent = 'Ошибка проверки.'; }
              $('check').disabled = false;
            }
            $('check').addEventListener('click', checkUpdate);
            $('install').addEventListener('click', async () => {
              $('install').disabled = true; $('upd').textContent = 'Скачиваю и устанавливаю…';
              try { await invoke('install_update'); } catch (e) { $('upd').textContent = String(e); $('install').disabled = false; }
            });
          })();
          </script></body></html>
          BCORE_EOF

